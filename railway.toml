# Конфигурация Railway. HTTPS, домен и роутинг даёт платформа — здесь только
# как собрать образ и как его запускать. Параллельно docker-compose.prod.yml
# остаётся вариантом для VPS (там же — Caddy и резервное копирование), эти
# два пути не пересекаются и не должны синхронизироваться построчно.
#
# Подробный пошаговый гайд — docs/RAILWAY_SETUP.md.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# startCommand НЕ задаётся специально. Причина найдена: Railway не
# гарантированно исполняет startCommand через шелл — на логах было видно,
# что `echo PORT=$PORT` печатал буквально "PORT=$PORT" без подстановки,
# значит и `--port $PORT` доезжал до uvicorn как строка "$PORT", а не как
# число, и тот падал ещё до первой строчки собственного лога. Раз Railway
# сам решает, как запускать startCommand — надёжнее вообще не давать ему
# этот выбор: используется ENTRYPOINT образа (entrypoint.sh, шебанг
# /bin/sh) — его шелл гарантирован спецификацией контейнера, а не тем, как
# Railway решит вызвать команду. Миграция (alembic upgrade head) и запуск
# uvicorn с $PORT теперь оба внутри entrypoint.sh — см. его комментарии.
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
# Не бесконечно: контейнер, который падает по кругу (например, из-за
# невалидной базы знаний при старте — см. app/main.py lifespan), должен
# в какой-то момент остаться упавшим и позвать на помощь, а не жечь часы
# биллинга на перезапуски.
restartPolicyMaxRetries = 5
