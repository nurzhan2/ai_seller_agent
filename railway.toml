# Конфигурация Railway. HTTPS, домен и роутинг даёт платформа — здесь только
# как собрать образ и как его запускать. Параллельно docker-compose.prod.yml
# остаётся вариантом для VPS (там же — Caddy и резервное копирование), эти
# два пути не пересекаются и не должны синхронизироваться построчно.
#
# Подробный пошаговый гайд — docs/RAILWAY_SETUP.md.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Миграции — часть каждого старта, а не отдельный ручной шаг: схема и код
# не должны расходиться после деплоя. $PORT — Railway задаёт его сам, не
# захардкожен нигде специально ради этого.

# ВРЕМЕННО: alembic исключён из старта, чтобы отделить проблему миграции от
# проблемы запуска приложения. Схема уже накачена (alembic_version =
# 8a38abd49cd8 в проде), сама миграция сейчас не нужна. Локально
# воспроизведено: `alembic upgrade head` на уже смигрированной базе
# отрабатывает штатно — печатает ровно те же две строки, что видны в Deploy
# Logs («Context impl PostgresqlImpl.» / «Will assume transactional DDL.»),
# и выходит с кодом 0 примерно за 1.4с, без единого лишнего байта на
# stdout/stderr. Это ожидаемое поведение no-op миграции, а не сбой — код
# alembic/env.py тут не главный подозреваемый (подробности — см. историю
# коммитов и комментарий ниже). Значит, тишина после этих двух строк и смерть
# контейнера ещё до echo — с высокой вероятностью что-то внешнее к
# Python-процессу (наблюдение, а не подтверждённая причина). Вернуть alembic
# в startCommand, когда контейнер начнёт стабильно подниматься без него —
# готовый отказоустойчивый вариант (явный код возврата, без молчаливого
# обрыва цепочки через &&) оставлен ниже закомментированным.
startCommand = "echo PORT=$PORT && python -u -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"

# Отказоустойчивый вариант с миграцией — на замену startCommand выше, когда
# запуск без alembic подтвердит, что дело было не в приложении. Через `;` +
# явную проверку $?, а не `&&` — ошибка миграции печатается и логируется
# всегда, а не тонет молча в оборванной цепочке. `exec` перед uvicorn отдаёт
# ему PID 1, чтобы он сам получал сигналы остановки от Railway, а не через
# промежуточный шелл.
# startCommand = "alembic upgrade head; ALEMBIC_STATUS=$?; if [ \"$ALEMBIC_STATUS\" -ne 0 ]; then echo \"ALEMBIC MIGRATION FAILED — exit code $ALEMBIC_STATUS, смотри traceback выше\" >&2; exit \"$ALEMBIC_STATUS\"; fi; echo \"ALEMBIC: migration ok\"; exec python -u -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
# Временно отключено — контейнер должен оставаться живым для захода через
# Railway Console, даже если /health отвечает degraded. Вернуть перед тем,
# как снова полагаться на автоматический рестарт по healthcheck.
# healthcheckPath = "/health"
# healthcheckTimeout = 300
restartPolicyType = "on_failure"
# Не бесконечно: контейнер, который падает по кругу (например, из-за
# невалидной базы знаний при старте — см. app/main.py lifespan), должен
# в какой-то момент остаться упавшим и позвать на помощь, а не жечь часы
# биллинга на перезапуски.
restartPolicyMaxRetries = 5
