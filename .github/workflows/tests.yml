name: tests

# Каждый пуш в main и каждый PR — полный pytest на тех же версиях, что в проде
# (constraints.txt). Красный крестик в GitHub = не выкатывать.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt
      - run: pip install -r requirements-dev.txt -c constraints.txt
      - run: python -m pytest -q -p no:cacheprovider --timeout=120
