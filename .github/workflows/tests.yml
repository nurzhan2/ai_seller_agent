name: tests

# Каждый пуш в main и каждый PR — полный pytest на тех же версиях, что в проде
# (constraints.txt). Красный крестик в GitHub = не выкатывать.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    # Конкретная версия, не ubuntu-latest: latest переезжает на Ubuntu 26
    # с 19.10.2026 — без нашего решения окружение тестов не меняется.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt
      - run: pip install -r requirements-dev.txt -c constraints.txt
      - run: python -m pytest -q -p no:cacheprovider --timeout=120
