# База знаний «ПарМангал» — каталог зон, цен и открытых вопросов.
# Источники: docs/source/official_pricing.md, docs/source/real_dialogs.md,
# docs/analysis/*.md (аудит), questions_for_client.md (вопросы заказчику, id секций 1.x-12.x).
#
# Правило: value: null означает, что агент НЕ имеет права называть эту цену/цифру
# клиенту и обязан эскалировать («уточню у менеджера»). Ничего не разрешено
# додумывать — см. loader.py::DisputedValue и tests/test_kb.py.

meta:
  version: 1
  updated_at: "2026-08-20"

constants:
  weekday_days: [mon, tue, wed, thu]
  weekend_days: [fri, sat, sun]

  # Праздничные дни считаются по тарифу ВЫХОДНОГО дня (ответ 7.2).
  # provisional снят — блокировка новогодних дат больше не действует.
  # Сам перечень дат заказчик отдельно не подтверждал: это стандартные
  # нерабочие дни РФ, вынесено в вопрос 14.6.
  # Формат MM-DD, повторяется ежегодно.
  holidays:
    provisional: false
    resolved_from: "client_answers (7.2)"
    dates:
      - "01-01"
      - "01-02"
      - "01-03"
      - "01-04"
      - "01-05"
      - "01-06"
      - "01-07"
      - "01-08"
      - "02-23"
      - "03-08"
      - "05-01"
      - "05-09"
      - "06-12"
      - "11-04"

  # Территория работает 9:00–23:00 (ответ 8.1), доплаты за поздние часы нет.
  # ВНИМАНИЕ: окно ПАКЕТОВ «весь день» осталось 10:00–22:00 (ответ 3.2) —
  # то есть окно работы и окно пакета теперь РАЗНЫЕ. Это не ошибка кодирования,
  # так ответил заказчик; вынесено в вопрос 14.3.
  working_window:
    from: "09:00"
    to: "23:00"
    disputed: false
    resolved_from: "client_answers (8.1)"

# 14.7: ссылка на сайт для зон вне объявлений (Часть 3 промта №11). Ни в
# одном источнике проекта URL не встречается — не выдумываем, эскалируем.
site_url:
  value: null
  disputed:
    variants: []
    sources: []
    question_id: "14.7"
    note: "Ни в official_pricing.md, ни в client_answers, ни в диалогах доменное имя не упоминалось."

venues:
  # Единый адрес для всех зон, расхождение «стр. 1 / стр. 2» закрыто (ответ 10.1).
  - id: parmangal
    name: "ПарМангал"
    address: "Троицк, деревня Тупиково, территория базы отдыха «Чайка», 1, стр. 2"
  - id: chaika
    name: "База отдыха «Чайка»"
    address: "Троицк, деревня Тупиково, территория базы отдыха «Чайка», 1, стр. 2"

zones:

  # ---------------------------------------------------------------- БАНИ ----
  - id: bath_russian
    venue: parmangal
    name: "Баня «Русский стиль»"
    category: bath
    capacity:
      value: 12
      resolved_from: "client_answers (1.6)"
    description: >
      Отдельно стоящая баня до 10 человек. В стоимость входят дрова, купель и
      мангал. Внутри — кухня с холодильником и посудой, купель, отливные вёдра,
      туалет, парилка и душ. Снаружи — своя мангальная зона со столом, лавками,
      зонтиком и мангалом.
    includes: [дрова, купель, мангал, кухня, холодильник, посуда, туалет, душ, парилка]
    photos: []
    booking_window: {from: "09:00", to: "23:00"}   # ответ 8.1
    pricing:
      mode: hourly
      weekday_per_hour: {value: 2500}
      weekend_per_hour: {value: 3500}
      min_hours: {value: 3}
    day_package: null
    promos_applicable: [sixth_hour_free, birthday_discount_10]   # answers 1.1, 1.2
    notes:
      - "Объявление на Авито называется «Приватная Русская баня в Ватутинках» — не совпадает с фактическим адресом «Тупиково». См. вопрос 10.1 и knowledge:avito_mapping."

  - id: bath_garage
    venue: parmangal
    name: "Баня «Гараж»"
    category: bath
    capacity:
      value: 10
      resolved_from: "client_answers (1.6)"
    description: >
      Отдельно стоящая баня до 10 человек, идентична по составу услуг бане
      «Русский стиль». В стоимость входят дрова, купель и мангал.
    includes: [дрова, купель, мангал, кухня, холодильник, посуда, туалет, душ, парилка]
    photos: []
    booking_window: {from: "09:00", to: "23:00"}   # ответ 8.1
    pricing:
      mode: hourly
      weekday_per_hour: {value: 2500}
      weekend_per_hour: {value: 3500}
      min_hours: {value: 3}
    day_package: null
    promos_applicable: [sixth_hour_free, birthday_discount_10]   # answers 1.1, 1.2
    notes:
      - "Минимум 2 разных объявления на Авито ведут на эту баню под разными заголовками («Гараж класса Люкс» и «Только вы и пар... в гаражном стиле»), с ценами-«от» 2499 и 2500 без указания часа/дня — вопрос 1.7."
      - "d20: клиентке назвали стандартную будничную цену 2500₽/час без применения спеццены 1500₽/час — не факт, что бронировалась именно эта баня, а не «Русский стиль»; зона в диалоге явно не названа."

  - id: bath_knight
    venue: parmangal
    name: "Баня «Рыцарская»"
    # Заказчик сам называет зону «Баня Замок Рыцаря» (так подписана папка с
    # фото на Авито) — не переименовываем zone_id/name, но агент должен
    # понимать и отвечать этим вариантом тоже (промт №13, вопрос 15.3).
    display_name_alt: "Баня Замок Рыцаря"
    category: bath
    capacity:
      value: 6
      resolved_from: "client_answers (1.6)"
    description: >
      Камерная баня, вместимость до 6 человек, комфортнее всего для 4-6 гостей.
      Тот же состав услуг, что у остальных бань (дрова, купель, мангал).
    includes: [дрова, купель, мангал, кухня, холодильник, посуда, туалет, душ, парилка]
    photos: []
    booking_window: {from: "09:00", to: "23:00"}   # ответ 8.1
    pricing:
      mode: hourly
      weekday_per_hour: {value: 2500}
      weekend_per_hour: {value: 3500}
      min_hours: {value: 3}
      # Спеццена 1500₽/час ОТМЕНЕНА заказчиком (ответы 1.4, 1.5).
      # Вместе с ней снят самый сложный краевой случай проекта —
      # неоднозначный calculation_mode.
    day_package: null
    promos_applicable: [sixth_hour_free, birthday_discount_10]   # answers 1.1, 1.2
    notes:
      - "На эту баню нет ссылки на Авито вообще: клиент прямо попросил и получил «Не вижу в профиле» (d13). Агент не должен обещать прислать ссылку — вопрос 12.2."

  # -------------------------------------------------------------- ДОМИК ----
  - id: house_relax
    venue: parmangal
    name: "Домик для отдыха"
    category: house
    capacity:
      value: 10
    description: >
      Аренда банного домика без использования парилки и купели: комната отдыха
      с кухней и отдельная мангальная зона. По прайсу бронь возможна в любое
      время с 10:00 до 22:00; за доплату можно дополнительно затопить баню.
    includes: [кухня, мангальная зона]
    photos: []
    booking_window: {from: "09:00", to: "23:00"}   # ответ 8.1
    pricing:
      mode: daily
      weekday_per_day: {value: 7000}
      # 2.1 — механика дожима: анкор 15000, пол 9500, скидка при низкой
      # загрузке. Механика заведена в concessions.yaml (ступень reduce_daily_rate).
      # Сама базовая цифра расходилась (прайс 14500, Максим — 15000 в живом
      # комментарии). Промт №11 решает это НАШИМ провизорным выбором: 15000,
      # потому что это прямое и более свежее указание владельца, а анкор выше
      # безопасен для нас — пол уступки 9500 уже реализован и не меняется.
      # Владелец эту цифру ещё не подтверждал формально — question_id 14.1
      # остаётся в open_questions, но больше не блокирует расчёт.
      weekend_per_day:
        value: 15000
        resolved_from: "нами, по указанию владельца (14.1, provisional)"
        provisional: true
      available_on_weekend: {value: true, resolved_from: "client_answers (2.2)"}
      # 2.3: пятница = выходной день, как и для остальных зон. Отдельная
      # зонозависимость day_type, введённая ради домика, снята: теперь
      # constants.weekend_days применяется единообразно ко всем зонам.
    extra_services:
      bath_heating:
        per_hour: {value: 1500, resolved_from: "client_answers (2.4)"}
        min_hours: {value: 3, resolved_from: "client_answers (2.4)"}
    day_package: null
    promos_applicable: []
    notes:
      - "«6-й час в подарок» и пакеты «весь день» на эту зону НЕ распространяются (прайс)."
      - "Объявление «весь день от 6999₽» (d04) — почти совпадает с будничным тарифом 7000₽; расхождение мелкое, считаем маркетинговым округлением (resolved_from: official_pricing), вопрос 2.5 оставлен неблокирующим."

  # ---------------------------------------------------------------- КУПОЛА ----
  - id: dome_bags
    venue: parmangal
    name: "Купол с мягкими мешками"
    category: dome
    capacity: {value: 10, resolved_from: "client_answers (3.3)"}
    description: >
      Одна из трёх прозрачных полусфер, обставлена мягкими мешками. Своя уличная
      зона с персональным мангалом и столиком со скамейками.
    includes: [стол, мангал]
    photos: []
    booking_window: {from: "09:00", to: "23:00"}   # ответ 8.1
    pricing:
      mode: hourly
      weekday_per_hour: {value: 1000}
      # Вопрос 3.1 (граница выходного тарифа) помечен заказчиком как блокирующий,
      # но фактического расхождения в ЦИФРЕ нет: шаблон менеджера в d05 пропускает
      # воскресенье в формулировке («Пт-Сб»), однако названная на воскресенье цена
      # (1500₽) совпадает с официальным Пт-Вс. Разрешено нами в пользу прайса.
      weekend_per_hour: {value: 1500, resolved_from: "official_pricing"}
      min_hours: {value: 3}
    day_package:
      price: {value: 5000}
      window: {from: "10:00", to: "22:00"}
      days: [mon, tue, wed, thu]
      usable_in_parts: {value: false, resolved_from: "client_answers (3.2)"}
      checkin_must_be_agreed: true    # 3.2: время заезда согласовывается заранее
    promos_applicable: [sixth_hour_free, birthday_discount_10]
    notes:
      - "d05: шаблон менеджера «Пн-Чт-1000₽ Пт-Сб-1500₽» не называет воскресенье явно — клиент переспрашивал. Фактическая цена на воскресенье (1500₽), которую в итоге назвали, совпадает с официальным Пт-Вс — расхождения в цифре нет, риск только в формулировке шаблона, resolved_from: official_pricing."
      - "Закрывающий час для почасовой (не «весь день») аренды купола прайс не декларирует вовсе — см. constants.working_window.disputed и вопрос 8.1. В d21 клиенту продали час до полуночи."

  - id: dome_blue_chairs
    venue: parmangal
    name: "Купол с синими креслами"
    category: dome
    capacity: {value: 7, resolved_from: "client_answers (3.3)"}
    description: "Одна из трёх прозрачных полусфер, обставлена синими креслами. Своя уличная зона с мангалом и столиком."
    includes: [стол, мангал]
    photos: []
    booking_window: {from: "09:00", to: "23:00"}   # ответ 8.1
    pricing:
      mode: hourly
      weekday_per_hour: {value: 1000}
      weekend_per_hour: {value: 1500}
      min_hours: {value: 3}
    day_package:
      price: {value: 5000}
      window: {from: "10:00", to: "22:00"}
      days: [mon, tue, wed, thu]
      usable_in_parts: {value: false, resolved_from: "client_answers (3.2)"}
      checkin_must_be_agreed: true    # 3.2: время заезда согласовывается заранее
    promos_applicable: [sixth_hour_free, birthday_discount_10]
    notes: []

  - id: dome_chairs
    venue: parmangal
    name: "Купол со стульями"
    category: dome
    capacity: {value: 7, resolved_from: "client_answers (3.3)"}
    description: "Одна из трёх прозрачных полусфер, обставлена стульями. Своя уличная зона с мангалом и столиком."
    includes: [стол, мангал]
    photos: []
    booking_window: {from: "09:00", to: "23:00"}   # ответ 8.1
    pricing:
      mode: hourly
      weekday_per_hour: {value: 1000}
      weekend_per_hour: {value: 1500}
      min_hours: {value: 3}
    day_package:
      price: {value: 5000}
      window: {from: "10:00", to: "22:00"}
      days: [mon, tue, wed, thu]
      usable_in_parts: {value: false, resolved_from: "client_answers (3.2)"}
      checkin_must_be_agreed: true    # 3.2: время заезда согласовывается заранее
    promos_applicable: [sixth_hour_free, birthday_discount_10]
    notes: []

  # ---------------------------------------------------------- ГРИЛЬ-ДОМИК ----
  - id: grill_house
    venue: parmangal
    name: "Гриль-домик («Зелёная зона»)"
    category: grill
    # 4.1: 12 взрослых, с детьми больше.
    capacity: {value: 12, resolved_from: "client_answers (4.1)"}
    description: >
      Вместимость до 10 человек (по прайсу — можно и больше, особенно с детьми).
      Внутри оборудована зона барбекю, снаружи — мангал и стол со скамейками.
    includes: [зона барбекю, мангал, стол]
    photos: []
    booking_window: {from: "09:00", to: "23:00"}   # ответ 8.1
    pricing:
      mode: hourly
      weekday_per_hour: {value: 1500}
      weekend_per_hour: {value: 2000}
      # 4.2: базовый минимум 3 часа; 2 часа возможны только через ступень
      # уступки при низкой загрузке (concessions.yaml, reduce_min_hours).
      min_hours: {value: 3, resolved_from: "client_answers (4.2)"}
    day_package:
      price: {value: 7000}
      window: {from: "10:00", to: "22:00"}
      days: [mon, tue, wed, thu]
      usable_in_parts: {value: false, resolved_from: "client_answers (3.2)"}
      checkin_must_be_agreed: true
    promos_applicable: [sixth_hour_free, birthday_discount_10]
    notes: []

  # ---------------------------------------------------------------- ШАТЁР ----
  - id: tent
    venue: parmangal
    name: "Шатёр"
    category: tent
    capacity:
      value: 30
    description: >
      Площадка для крупных мероприятий (праздники, корпоративы, свадьбы).
      Минимальное время аренды — 3 часа.
    includes: [столы, скамейки, мангал]
    photos: []
    booking_window: {from: "09:00", to: "23:00"}   # ответ 8.1
    pricing:
      mode: hourly
      rate_depends_on_guests: true    # единственная зона с такой зависимостью — см. engine
      guests_required: true           # без числа гостей ставка не определяется → needs_input
      min_hours: {value: 3}
      # 5.1: разницы между буднями и выходными у шатра НЕТ — тариф одинаков
      # всю неделю, поэтому отдельного weekday_per_hour больше не существует.
      # В будни дополнительно доступен пакет «весь день за 7500».
      # 5.2: ровно 20 гостей идут по НИЖНЕМУ тарифу (граница включительно).
      rate_is_same_all_week: true
      resolved_from: "client_answers (5.1, 5.2)"
      guest_tiers:
        - max_guests: 20
          per_hour: {value: 2500}
        - max_guests: 30
          per_hour: {value: 4000}
    day_package:
      price: {value: 7500}
      window: {from: "10:00", to: "22:00"}
      days: [mon, tue, wed, thu]
      usable_in_parts: {value: false}
    promos_applicable: [birthday_discount_10]
    notes:
      - "d20: скидка 10% на день рождения фактически применена не к шатру, а к бане в этом же диалоге — см. promos.yaml disputed_zones и вопрос 1.2."

  # ----------------------------------------------------------------- ЮРТА ----
  - id: yurt
    venue: chaika
    name: "Юрта"
    category: yurt
    capacity:
      value: 2
    description: >
      Обустроенная юрта для двоих со светом, розетками и всем необходимым для
      ночёвки. Для больших компаний можно поставить свою палатку рядом.
    includes: [свет, розетки]
    photos: []
    booking_window: null
    pricing:
      mode: daily
      per_day: {value: 4000}
      checkin: {value: "14:00", resolved_from: "client_answers (6.1)"}
      checkout: {value: "12:00 следующего дня"}
    day_package: null
    promos_applicable: []
    # 6.2-6.5: заказчик ответил «переводим на админа» по всем четырём.
    # Это НЕ цены, а правила эскалации. Цена 1000₽ за животных удалена
    # полностью — она не должна фигурировать в базе нигде.
    escalation_topics:
      - id: pets
        trigger: "клиент спрашивает про животных"
        rule: "Цену не называть и НЕ отказывать. Сразу escalate_to_human."
        resolved_from: "client_answers (6.2, 6.3)"
      - id: guest_table
        trigger: "гостям юрты нужен стол со скамейками"
        rule: "Цену не называть. Сразу escalate_to_human."
        resolved_from: "client_answers (6.4)"
      - id: own_tent
        trigger: "клиент хочет поставить свою палатку рядом"
        rule: "Условия не называть. Сразу escalate_to_human."
        resolved_from: "client_answers (6.5)"
    notes:
      - "На территории проживает собственная собака: «боюсь они подерутся» (d24) — доплата за животное не гарантирует автоматический допуск, решение эскалируется менеджеру. См. knowledge:pet_policy_risk и вопрос 6.3."

