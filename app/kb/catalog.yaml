# Ответы на частые вопросы клиентов (faq.md), где официального прайса нет вообще
# или он неполный. confidence: confirmed (подтверждено заказчиком) |
# from_dialogs (устойчиво повторяется в диалогах, официально не подтверждено) |
# unknown (не встречается нигде, чистая дыра).
knowledge:
  - question_topic: "Точный адрес комплекса"
    answer: "Троицк, деревня Тупиково, территория базы отдыха «Чайка», 1, строение 2. Адрес единый для всех зон."
    source: "client_answers (10.1)"
    confidence: confirmed

  - question_topic: "Как добраться, парковка, навигатор"
    answer: >
      На картах и в навигаторе ищите «ПарМангал»:
      https://yandex.ru/navi/org/parmangal/68897531294 . На территории есть
      парковка.
    source: "client_answers (10.2)"
    confidence: confirmed

  - question_topic: "Можно ли приехать посмотреть территорию до оплаты"
    answer: "Да, приезжайте посмотреть. Предупредите, пожалуйста, за час до приезда."
    source: "client_answers (10.3)"
    confidence: confirmed

  - question_topic: "Время работы территории, до скольки можно шуметь"
    answer: >
      Территория работает с 9:00 до 23:00, доплаты за поздние часы нет.
      Шумные компании — до 23:00.
    source: "client_answers (8.1, 8.2)"
    confidence: confirmed

  - question_topic: "Река, купание, рыбалка, сапы"
    answer: "Купаться нельзя. Рыбалка есть. Спуск для сапов не оборудован."
    source: "client_answers (11.1)"
    confidence: confirmed

  - question_topic: "Конная прогулка"
    answer: null
    source: "client_answers (11.2) — переводим на админа"
    confidence: unknown

  - question_topic: "Своя еда и алкоголь, пробковый сбор, кухня"
    answer: >
      Своей кухни у нас нет. Еду и напитки можно привозить с собой или
      заказывать доставку. Пробкового сбора нет.
    source: "client_answers (11.3)"
    confidence: confirmed

  - question_topic: "Что входит в стоимость: посуда"
    answer: >
      Посуда входит ТОЛЬКО в банях. В куполах, гриль-домике, шатре и юрте
      посуду гости привозят свою.
    source: "client_answers (11.4)"
    confidence: confirmed

  - question_topic: "Что входит в стоимость: мангал и детская площадка"
    answer: "Мангал входит в стоимость у каждой зоны. На территории есть детская площадка."
    source: "client_answers (11.4)"
    confidence: confirmed

  - question_topic: "Санузел: где свой, где общий"
    answer: >
      В каждой бане свой санузел. Для куполов, гриль-домика и шатра —
      отдельный общий санузел на территории.
    source: "client_answers (11.4)"
    confidence: confirmed

  - question_topic: "Что везти с собой: уголь, решётки, шампуры"
    answer: "Уголь, решётки и шампуры можно привезти свои или взять у нас в аренду."
    source: "client_answers (11.5)"
    confidence: confirmed

  - question_topic: "Почему в объявлении цена ниже, чем вы называете"
    answer: >
      В объявлении указана минимальная цена — она действует с понедельника по
      четверг. В пятницу, субботу и воскресенье тариф выше.
    source: "client_answers (1.7)"
    confidence: confirmed

  - question_topic: "Праздничные дни: по какому тарифу"
    answer: "Праздничные дни считаются по тарифу выходного дня."
    source: "client_answers (7.2)"
    confidence: confirmed

  - question_topic: "Возврат предоплаты и перенос даты"
    answer: >
      Полный возврат предоплаты при отмене не позднее чем за 7 дней до заезда.
      Позже возврат невозможен, но дату можно перенести, если желаемая дата
      свободна.
    source: "client_answers (9.3)"
    confidence: confirmed

  - question_topic: "Пакет «весь день» для купола: можно ли дробить, во сколько заезд"
    answer: >
      Пакет действует с 10:00 до 22:00 и на части не делится. Приехать можно
      позже, но время заезда нужно согласовать заранее.
    source: "client_answers (3.2)"
    confidence: confirmed

  - question_topic: "Животные, стол для гостей юрты, своя палатка"
    answer: null
    source: "client_answers (6.2, 6.3, 6.4, 6.5) — переводим на админа"
    confidence: unknown

  - question_topic: "Соответствие объявлений Авито и зон комплекса"
    answer: >
      Отдельных объявлений на каждую баню нет — они общие. Если из объявления
      непонятно, какая именно зона нужна клиенту, надо уточнить у него.
    source: "client_answers (12.2), d13, d14, d15, d20"
    confidence: confirmed

