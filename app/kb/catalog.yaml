     resolved_by: "нами, предварительно",
     note: "Промт №3.2: проставлено предварительное значение 2 дня (provisional: true), чтобы ценовые ступени не были мёртвыми на запуске. Каждая такая уступка помечается в логе provisional_policy: true. Снят с блокирующих, но ответ заказчика по-прежнему нужен."}
