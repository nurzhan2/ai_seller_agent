  # Раздел 14. Появилось после ответов заказчика (промт №10)
  - {id: "14.1", section: "Домик", text: "Домик в выходные: в прайсе 14 500, Максим называет 15 000. Какая цифра базовая? Пол 9 500 мы уже зафиксировали как уступку.", blocking: false, status: open,
     resolved_by: "нами, по указанию владельца, provisional",
     note: "Промт №11: закрыт нашим провизорным решением — 15 000 ₽, как прямо сказал владелец («сначала говорить 15 000»), это свежее прайса с 14 500. Анкор выше безопасен: пол уступки 9 500 ₽ и ступень reduce_daily_rate уже реализованы и не меняются. Снят с блокирующих, но формального подтверждения владельца по этой конкретной цифре мы не получали."}
  - {id: "14.2", section: "Время работы", text: "«В банях можно отдыхать и позже 23:00» — до скольки именно?", blocking: false, status: open,
     resolved_by: "нами",
     note: "Промт №11: закрыт нашим решением, а не цифрой заказчика. Брони, укладывающиеся до 23:00, считаются нормально. Всё, что выходит за 23:00, эскалируется менеджеру с формулировкой «уточню, можно ли продлить» — агент ничего не считает и не продаёт без подтверждения человека. Так же закрывает 8.3."}
  - {id: "14.3", section: "Время работы", text: "Пакеты «весь день» остаются 10:00-22:00 при рабочем окне 9:00-23:00? Окна получились разные.", blocking: false, status: open}
  - {id: "14.4", section: "Оплата", text: "Предоплата для домика, юрты и пакетов «весь день», где часа нет — сколько?", blocking: false, status: answered,
     note: "Промт №11: закрыт по цифре из исходного official_pricing.md — «за Домик на день и пакеты „Весь день\" сумма уточняется, стандартно это 3 000 рублей». Это не наша выдумка, цифра стояла в прайсе заказчика с самого начала аудита. Применяется к house_relax, yurt и всем day_package."}
  - {id: "14.5", section: "Уступки", text: "«Нет наплыва» и «просадка» — нужен измеримый критерий. Предлагаем: занято меньше половины зон на эту дату. Подтвердите или назовите своё число.", blocking: false, status: open}
  - {id: "14.6", section: "Акции", text: "Список праздничных дат на год — подтвердите стандартный перечень нерабочих дней РФ (1-8 января, 23 февраля, 8 марта, 1 и 9 мая, 12 июня, 4 ноября).", blocking: false, status: open}
