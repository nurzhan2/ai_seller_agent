# Соответствие названий подпапок с Google Drive → zone_id (или категория
# общих фото территории). Правится вручную, если заказчик назвал папку иначе,
# чем в списке синонимов ниже — добавьте вариант в нужный список.
#
# Сравнение регистронезависимое, "ё" приравнивается к "е", любые небуквенные
# символы (дефисы, подчёркивания, лишние пробелы) игнорируются — так что
# "Баня-Русский_стиль" и "баня русский стиль" совпадут с одним и тем же
# синонимом без правки этого файла.

zones:
  bath_russian: ["баня русский стиль", "русский стиль", "баня русская", "bath_russian"]
  bath_garage: ["баня гараж", "гараж", "bath_garage"]
  bath_knight: ["баня рыцарская", "рыцарская", "баня замок рыцаря", "замок рыцаря", "bath_knight"]
  house_relax: ["домик для отдыха", "домик", "house_relax"]
  dome_bags: ["купол мешки", "купол с мешками", "мешки", "dome_bags"]
  dome_blue_chairs: ["купол синие кресла", "синие кресла", "купол кресла", "dome_blue_chairs"]
  dome_chairs: ["купол стулья", "стулья", "dome_chairs"]
  grill_house: ["гриль домик", "гриль-домик", "зелёная зона", "зеленая зона", "grill_house"]
  tent: ["шатер", "шатёр", "tent"]
  yurt: ["юрта", "yurt"]

# Общие фото территории — не относятся к одной зоне, идут в catalog.yaml → site_photos.
site:
  playground: ["детская площадка", "площадка", "playground"]
  restroom: ["санузел", "туалет", "restroom"]
  overview: ["общий вид", "территория", "общий вид территории", "overview"]
