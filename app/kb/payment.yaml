# Оплата. НИКАКИХ номеров телефонов получателей и НИКАКИХ названий банков в
# этом файле быть не должно ни при каких условиях — они нестабильны (меняются
# от сделки к сделке, см. docs/analysis/REPORT.md → «Ограничения для агента»)
# и агенту запрещено их произносить. tests/test_kb.py проверяет это regex'ом.

payment:
  method: yclients_link        # заказчик подтвердил: ссылка или QR из YCLIENTS (промт №2, вводная часть)
  ai_may_send_payment_link: true
  ai_may_send_bank_details: false      # НИКОГДА, ни при каких условиях
  ai_may_send_phone_number: false      # НИКОГДА, ни при каких условиях
  handoff_on_payment_step: true        # этап оплаты всегда передаётся живому оператору

  link_type:
    value: null
    disputed:
      variants: ["static_per_zone", "dynamic_per_booking"]
      sources: ["не встречается в диалогах — ссылки на YCLIENTS в исходниках нет вообще"]
      question_id: "9.4"
      note: "Новый вопрос, добавлен при сборке базы знаний — заказчик подтвердил только сам метод оплаты (YCLIENTS), не тип ссылки."

  # 9.1: единая формула для почасовых зон — предоплата равна стоимости
  # ПЕРВОГО ЧАСА. У суточных зон и пакетов «весь день» часа нет вовсе.
  prepayment_rule:
    value: "first_hour_price"
    resolved_from: "client_answers (9.1)"

  # 14.4: фиксированная предоплата для суточных зон (домик, юрта) и всех
  # пакетов «весь день», где стоимость первого часа не определена. Это не
  # наша выдумка — цифра стояла в исходном прайсе заказчика с самого начала
  # аудита: «за Домик на день и пакеты „Весь день" сумма уточняется,
  # стандартно это 3 000 рублей» (official_pricing.md, «Правила бронирования»).
  daily_and_package_prepayment:
    value: 3000
    resolved_from: "official_pricing.md («Правила бронирования») — промт №11, вопрос 14.4"

  refund_rule:
    text: >
      Полный возврат предоплаты при отмене не позднее чем за 7 дней до заезда.
      Позже возврат невозможен, но дату можно перенести, если желаемая дата
      свободна.
    confidence: confirmed
    source: "client_answers (9.3)"

  no_credentials_policy:
    text: >
      В базе знаний нет ни одного номера телефона получателя и ни одного
      названия банка из диалогов. Их нашли в аудите (docs/analysis/REPORT.md,
      раздел «Ограничения для агента») и туда же перечислили — сюда их
      переносить запрещено. Агент никогда не диктует клиенту реквизиты
      предоплаты, ни из базы знаний, ни из истории диалогов — этот шаг всегда
      передаётся живому менеджеру.
    confidence: confirmed
    source: "client_answers (9.2) — схема прямо подтверждена заказчиком"
